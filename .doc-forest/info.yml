schema_version: '1.0'
purpose: 离线经典无猜扫雷游戏
contents_summary: 页面管理对局与提示；独立引擎构造棋局、验证技巧解法并判定开格安全性。
entry: index.html
files:
- name: LICENSE
  purpose: 本仓库原创代码和随附文档的 MIT 许可证
- name: README.md
  purpose: 游戏操作、生成规则与难度指标说明
- name: app.js
  purpose: 管理游戏与局面编辑、公开答案和同屏证明，在后台执行构造与无猜验证
  details: 游戏与编辑器共享种子、当前步判定、本局峰值与余局平均线索数和开扩；手动和单步先画红标，标齐后使用同一批次提交；单步在批次已标齐时直接提交，自动求解自行提交。公式行和元素通过鼠标悬停、触屏点按联动棋盘高亮。
  depends_on:
  - target: engine.js
    reason: 复用开局、判定、开格和提示的规则
  - target: proof-format.js
    reason: 格式化不等式、组合变量和对应格子坐标
  - target: board-input.js
    reason: 复用手动确认批次、蓝色记号历史和棋盘笔迹路径
  - target: position-seed.js
    reason: 复用局面编码、解码和结构检查
  - target: game-feedback.js
    reason: 在实际棋盘状态变化后播放一次性反馈
- name: board-input.js
  purpose: 收集手动求解确认，管理蓝色记号与可闭合的连格笔迹，按整笔记录拖画历史
- name: engine.js
  purpose: 从局部种子增量构造棋局，验证难度和最少线索技巧通关，判定安全格
  details: 按邻域交叠构造局部雷位，高峰值目标可使用偶数闭环或小盘总雷数相消结构。续局可重排同受一组公开线索约束的未判定格。认证与游戏共享提示和确认规则；生成逐轮报告最接近的已认证候选，三项难度均达标才发放棋局。
  core: true
- name: engine.test.cjs
  purpose: 检验构造、开格、最少线索证明、手动批次、蓝色历史与笔迹路径
  depends_on:
  - target: engine.js
    reason: 核验游戏规则、生成和解题引擎
  - target: proof-format.js
    reason: 核验变量组合和区域坐标显示
  - target: board-input.js
    reason: 核验手动批次、记号历史与笔迹覆盖
- name: game-feedback.js
  purpose: 播放棋格反馈和本地合成音效，管理游戏内动画偏好
- name: game-motion.css
  purpose: 统一按钮按压、可反向的圆弧与轨道过渡、提交入口和长按进度
- name: index.html
  purpose: 离线游戏入口，定义生成设置、编辑器、局面种子对话框和棋盘证明区域
- name: position-seed.js
  purpose: 使用无前缀 Base92 读写雷图局面和数字草稿，保留旗标与双色记号
- name: proof-format.js
  purpose: 保留公式的比较关系，格式化负常数换位、组合变量与区域坐标
  details: 将连续加减合为一式，保留取整边界；按格区分完全相消、正项剩余和负项剩余。
- name: styles.css
  purpose: 定义响应式布局、棋盘和推导外观、公式高亮及悬浮圆弧几何
  details: 推导原位替换当前推理指标；临时工具用浮层和预留位置维持棋盘及控件坐标。

schema_version: '1.0'
purpose: 离线经典无猜扫雷游戏
contents_summary: 应用协调对局和编辑器的交互与后台请求，Model 提供局面与标记状态，View 负责棋盘和工具显示。引擎组装棋盘规则、公开约束、技巧推理和棋局生成。
entry: index.html
files:
- name: LICENSE
  purpose: 本仓库原创代码和随附文档的 MIT 许可证
- name: README.md
  purpose: 游戏操作、生成规则与难度指标说明
- name: app.js
  purpose: 组装 Model、View 和服务，协调对局、编辑器、事件与后台请求
  details: 游戏与编辑器共享种子和公开局面判定。编辑器分别核验红标、旗子和无猜通关。对局在确认全部结论后提交，过期的提示结果会丢弃。公式行和选区文字可联动棋盘高亮。编辑时保留原棋局选区，重开时清空选区、标记及历史。复杂选区在后台整理表达式并精确计数，过期任务可取消。搜索结束后结果保留至首次棋盘操作。
  depends_on:
  - target: engine.js
    reason: 复用开局、判定、开格、提示及选区可能雷数的规则
  - target: proof-format.js
    reason: 格式化选区表达式和格子坐标，并组装推导渲染器
  - target: proof-renderer.js
    reason: 创建推导步骤和可联动棋盘的公式元素
  - target: generation-controller.js
    reason: 管理并行搜索的状态、候选和 Worker 生命周期
  - target: board-input.js
    reason: 管理画笔输入与标记工具状态
  - target: model
    reason: 创建与变换游戏和编辑器局面，维护确认与标记数据
  - target: view
    reason: 将应用状态和用户操作结果呈现在棋盘、推理和控制区
  - target: position-seed.js
    reason: 复用局面编码、解码和结构检查
  - target: game-feedback.js
    reason: 统一播放棋盘操作和状态变化的反馈
  - target: game-fullscreen.js
    reason: 控制原生和网页内全屏切换
  - target: radial-layout.js
    reason: 为页面工具布局提供纯几何算法
  - target: game-tool-layout.js
    reason: 将计算结果应用到圆弧按钮和推导面板并保持焦点
  - target: proof-layout.js
    reason: 为推导面板适配层注入与页面无关的布局规则
  - target: game-requests.js
    reason: 发起提示、判定、开格和开扩等请求，并同步界面忙碌状态
  - target: region-selection.js
    reason: 管理选区系数历史并为选区和推导生成轮廓
  - target: selection-expression.js
    reason: 为选区模块和后台线程提供同一套表达式合并规则
- name: board-input.js
  purpose: 将指针与按键交互转成标记操作，管理画笔工具、长按和撤销重做按钮
  details: Node.js 入口保留既有导出，转发至标记模型和笔迹视图。
  depends_on:
  - target: view/ink-view.js
    reason: 显示与棋盘笔迹一致的标记符号
- name: engine-board.js
  purpose: 提供基础棋盘规则与可复现的随机序列
  details: 定义八邻域、初始雷位、自动展开、数字格操作和种子随机数。
- name: engine-constraints.js
  purpose: 将公开线索转换为约束，求全部可行布局中的必然结论和选区可能取值
  details: 区域传递跟踪各条边界线索的联合余量，按公开总雷数合并后反向分类。选区用分层动态规划保留离散取值。符合公开条件但后续需要猜的布局也计入。
  depends_on:
  - target: engine-board.js
    reason: 由组装层注入八邻域规则
- name: engine-generation.js
  purpose: 用局部线索拼接、闭环和消去结构构造候选棋局，并以难度目标排名
  details: 复用已拼子块，保留原峰值搜索和二分候选拼接。高峰值候选可交换未判定雷位，复用已认证的前缀并重新回放整局。峰值都达标时优先比较多线索步骤占比。
  depends_on:
  - target: engine-board.js
    reason: 由组装层注入棋盘操作和随机数
  - target: engine-constraints.js
    reason: 由组装层注入约束能力，预筛开局和续接结构
  - target: engine-inference.js
    reason: 由组装层注入证明与全局认证能力，核验每个发放候选
- name: engine-inference.js
  purpose: 从公开线索构造技巧证明、找最少线索，协调开格和全局通关认证
  details: 为游戏和生成认证提供同一套确认及回放规则。完整参考生成器按公开约束逆向枚举开局。
  depends_on:
  - target: engine-board.js
    reason: 由组装层注入邻域、开局和揭示规则
  - target: engine-constraints.js
    reason: 由组装层注入局面约束和精确判定，用于核对最少线索及安全开格
- name: engine.js
  purpose: 组装棋盘、公开约束、技巧推理与生成能力，提供浏览器和 Node.js 共用的公开 API
  details: 按模块的依赖顺序打包同一组工厂函数，供离线页面的 Blob Worker 执行。
  core: true
  depends_on:
  - target: engine-board.js
    reason: 提供八邻域、开格和基础棋盘状态
  - target: engine-constraints.js
    reason: 提供公开约束、精确分类和加权选区的可能取值
  - target: engine-inference.js
    reason: 提供可展示的最少线索推导、确认和通关验证
  - target: engine-generation.js
    reason: 提供局部拼接、候选排名和棋局搜索
- name: engine.test.cjs
  purpose: 检验区域传递、小盘穷举、线索图拼接、开格、最少线索证明、手动批次、红蓝标记历史与笔迹路径
  depends_on:
  - target: engine.js
    reason: 核验游戏规则、生成、推理和选区可能雷数
  - target: proof-format.js
    reason: 核验变量组合和区域坐标显示
  - target: board-input.js
    reason: 核验手动批次、记号历史与笔迹覆盖
  - target: generation-controller.js
    reason: 核验并行补位、原目标保留和采用候选
- name: favicon.svg
  purpose: 与游戏标题徽标一致的浏览器标签图标
- name: game-feedback.js
  purpose: 播放按钮与棋格反馈，保存音效和动画偏好
  details: 默认开启音效，在用户操作后启用本地合成音频；快速连画按实际改变的格子错峰播放。
- name: game-feedback.test.cjs
  purpose: 核验音效默认状态、首次交互、静音偏好和快速连画调度
  depends_on:
  - target: game-feedback.js
    reason: 核验音频启用和反馈播放条件
- name: game-fullscreen.js
  purpose: 控制电脑端原生全屏和网页内回退；移动设备不启用全屏控制器
- name: game-fullscreen.test.cjs
  purpose: 核验移动设备屏蔽及电脑端的原生全屏、网页内回退和旧版 WebKit 事件
  depends_on:
  - target: game-fullscreen.js
    reason: 核验全屏控制器对浏览器事件和能力差异的处理
- name: game-motion.css
  purpose: 统一按钮、圆弧菜单、面板和对话框的过渡，保留长按进度反馈
- name: game-requests.js
  purpose: 管理对局和编辑器共用的单请求 Worker 通道
  details: 收到计算结果或传输失败后解除忙碌，失败和取消时回收旧线程并忽略迟到消息。
- name: game-tool-layout.js
  purpose: 测量视口和控件，将布局结果应用到圆弧及推导窗，管理侧栏、浮窗和手机分屏的切换及焦点恢复
  depends_on:
  - target: radial-layout.js
    reason: 使用注入的几何算法设置圆弧按钮和轨迹
  - target: proof-layout.js
    reason: 使用注入的布局规则布置浮窗及避让关闭按钮
- name: generation-controller.js
  purpose: 调度搜索线程、汇总进度和最优候选，并报告搜索结果
  details: 通过注入的并发策略、随机数与 Worker 接口启动搜索。第一路保留原目标，异常退出时补位。首个达标结果结束整组搜索，异常后可保留候选供手动载入。
- name: index.html
  purpose: 离线游戏入口，定义生成设置、编辑器、局面种子对话框和棋盘证明区域
- name: model.test.cjs
  purpose: 脱离浏览器核验回合准备及提交和数字草稿尺寸变换
  depends_on:
  - target: model
    reason: 直接调用棋局及编辑器状态操作
- name: position-seed.js
  purpose: 使用无前缀 Base92 读写雷图局面和数字草稿，保存已开格、旗子和红标，不存蓝标
  details: 红标字段仅保留未开格上的记录，导入和导出时都忽略已开格上的红标。
- name: proof-format.js
  purpose: 保留公式的比较关系，格式化负常数换位、组合变量与区域坐标
  details: 将连续加减合为一式，保留取整边界；按格区分相消项、正项和负项。按原式的上下界识别可直接定值的格子，供推导面板合并结论并裁剪未使用的步骤。
- name: proof-layout.js
  purpose: 根据视口、推理区域和工具坐标计算浮窗位置及关闭按钮的可点击位置
  details: 返回 CSS 像素坐标和正文可用空间。关闭按钮找不到空位时由页面决定如何回退。
- name: proof-layout.test.cjs
  purpose: 核验狭窄视口的正文空间、按钮避让和无空位情况
  depends_on:
  - target: proof-layout.js
    reason: 直接验证视口坐标与布局结果
- name: proof-panel.test.cjs
  purpose: 用导入局面核验推导公式、引用编号与结论高亮，并验证请求取消
  depends_on:
  - target: app.js
    reason: 核验提示显示切换和自动求解取消
  - target: proof-renderer.js
    reason: 核验推导面板对重复证明和必要前提的取舍
  - target: game-requests.js
    reason: 验证取消后解除忙碌且不渲染迟到结果
- name: proof-renderer.js
  purpose: 把线索、推导公式和结论渲染为可联动棋盘的元素
  details: 接收当前棋局、公式格式和坐标定位接口，生成推导节点及其高亮数据；页面控制悬停、点按和焦点事件。
  depends_on:
  - target: proof-format.js
    reason: 使用页面注入的公式计算、关系整理和坐标格式能力
- name: radial-browser.test.cjs
  purpose: 在 Chromium 内验证按钮命中、全屏缩放、手机分屏的实际触屏手势、推导窗焦点和请求错误恢复
  depends_on:
  - target: index.html
    reason: 加载实际页面和样式，验证控件在浏览器绘制后仍可点击
- name: radial-layout.js
  purpose: 按按钮实际尺寸和视口计算菜单位置，支持环绕主按钮的标记、选区和提示圆弧
- name: radial-layout.test.cjs
  purpose: 核验圆弧菜单中心、边缘适配和双列按钮布局
  depends_on:
  - target: radial-layout.js
    reason: 验证响应式菜单几何计算
- name: region-selection.js
  purpose: 管理选区系数、历史、已知格和棋盘轮廓
  details: 独立历史同时恢复格子、线索与矩形的系数。轮廓保留内部空洞，在不与另一颜色相交时连接对角区域。
  depends_on:
  - target: engine.js
    reason: 使用注入的八邻域函数定位数字格的选区
  - target: selection-expression.js
    reason: 共享系数相消、已知格过滤和表达式整理规则
- name: region-selection.test.cjs
  purpose: 核验选区相消、区域简化、撤销重做及轮廓
  depends_on:
  - target: region-selection.js
    reason: 验证选区运算规则
- name: selection-expression.js
  purpose: 根据格子系数、公开线索和已知格整理等价选区表达式
  details: 优先减少总项数，在预算内尝试用完整线索邻域和矩形替代离散格。正系数项排在前。页面和后台线程共用此实现。
- name: styles.css
  purpose: 定义响应式布局、棋盘和推导外观、公式高亮及悬浮圆弧几何
  details: 棋盘按可用宽高缩放方格、坐标、数字和图标，达到最小格尺寸时允许棋盘内滚动。桌面推导与当前推理原位切换；窄屏桌面使用推导浮窗。手机打开推导时平分屏幕，棋盘和推导独立滚动；关闭后恢复常规布局，当前推理位于棋盘下方。搜索状态、操作提示和选区使用独立卡片，按内容和可用宽度排布，隐藏的卡片不占空间。长选区内容可在读数内滚动。短横屏推导浮窗为右侧推理工具留出空间。全屏沿用屏幕方向和原有工具布局。
directories:
- name: model
- name: view

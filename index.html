<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>无猜扫雷EZMS</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css?v=20261128-3">
  <link rel="stylesheet" href="game-motion.css?v=20261127-2">
  <script defer src="region-selection.js?v=20261127-8"></script>
  <script defer src="radial-layout.js?v=20261127-10"></script>
  <script defer src="engine.js?v=20261128-1"></script>
  <script defer src="proof-format.js?v=20261128-1"></script>
  <script defer src="board-input.js?v=20261127-13"></script>
  <script defer src="position-seed.js?v=20261126-3"></script>
  <script defer src="game-feedback.js?v=20261126-8"></script>
  <script defer src="game-fullscreen.js?v=20261126-10"></script>
  <script defer src="app.js?v=20261128-9"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="mine" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8 3 3M5 19l3-3m8-8 3-3"/></symbol>
    <symbol id="flag" viewBox="0 0 24 24"><path d="M5 21V4c4-3 8 3 14 0v10c-6 3-10-3-14 0"/></symbol>
    <symbol id="undoIcon" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="redoIcon" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5m5 5H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
    <symbol id="restartIcon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 1.6 5.1M3 4v8h8"/></symbol>
    <symbol id="hintIcon" viewBox="0 0 24 24"><path d="M9 18h6m-5 4h4m-5-7c0-2-3-3-3-7a6 6 0 1 1 12 0c0 4-3 5-3 7"/></symbol>
    <symbol id="play" viewBox="0 0 24 24"><path d="m8 5 12 7-12 7Z"/></symbol>
    <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="closeIcon" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="panelChevron" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
    <symbol id="pen" viewBox="0 0 24 24"><path d="m4 20 4-1 11-11-3-3L5 16l-1 4Zm9-12 3 3"/></symbol>
    <symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="formulaIcon" viewBox="0 0 24 24"><path d="M18 5H6l6 7-6 7h12"/></symbol>
    <symbol id="selectionIcon" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="1" stroke-dasharray="3 2"/></symbol>
    <symbol id="selectionAddIcon" viewBox="0 0 24 24"><path d="M15 8H4v12h12v-8" stroke-dasharray="2.5 2"/><path d="M20 1v6m-3-3h6"/></symbol>
    <symbol id="selectionSubtractIcon" viewBox="0 0 24 24"><path d="M15 8H4v12h12v-8" stroke-dasharray="2.5 2"/><path d="M17 4h6"/></symbol>
    <symbol id="stepIcon" viewBox="0 0 24 24"><path d="m5 5 10 7-10 7V5Zm14 0v14"/></symbol>
    <symbol id="stopIcon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></symbol>
    <symbol id="eraser" viewBox="0 0 24 24"><path d="m4 14 9-9a2 2 0 0 1 3 0l4 4a2 2 0 0 1 0 3l-7 7H9l-5-5Zm5-5 8 8M13 19h8"/></symbol>
    <symbol id="cursorIcon" viewBox="0 0 24 24"><path d="m4 4 7.07 17 2.51-7.39L21 11.07 4 4Z"/><path d="m13.5 13.5 6 6"/></symbol>
    <symbol id="importIcon" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 15v5h14v-5"/></symbol>
    <symbol id="exportIcon" viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M5 15v5h14v-5"/></symbol>
    <symbol id="volumeOff" viewBox="0 0 24 24"><path d="m11 5-6 4H2v6h3l6 4zM16 9l5 6m0-6-5 6"/></symbol>
    <symbol id="volumeOn" viewBox="0 0 24 24"><path d="m11 5-6 4H2v6h3l6 4zm5 4a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></symbol>
    <symbol id="motionIcon" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/><circle cx="3" cy="12" r="1"/><circle cx="21" cy="12" r="1"/></symbol>
  </svg>
  <div id="gameViewport">
  <main>
    <header>
      <h1><span class="game-emblem"><svg class="icon" aria-hidden="true"><use href="#mine"/></svg></span>无猜扫雷EZMS</h1>
      <div class="header-tools">
        <div class="mode-switch" role="group" aria-label="棋盘模式">
          <button id="gameMode" type="button" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#play"/></svg>游戏</button>
          <button id="editMode" type="button" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#pen"/></svg>局面编辑器</button>
        </div>
        <button id="motionToggle" class="icon-button" type="button" aria-label="动画效果" aria-pressed="true" title="关闭动画效果"><svg class="icon" aria-hidden="true"><use href="#motionIcon"/></svg></button>
        <button id="soundToggle" class="icon-button" type="button" aria-label="反馈音效" aria-pressed="true" title="关闭反馈音效"><svg class="icon" aria-hidden="true"><use href="#volumeOn"/></svg></button>
        <button id="fullscreenToggle" class="icon-button" type="button" aria-label="进入全屏" title="进入全屏" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5m0 8v5h-5M8 21H3v-5"/></svg></button>
      </div>
      <span id="fullscreenStatus" role="status"></span>
    </header>

    <div class="setup-bar">
    <form id="settings" class="settings" autocomplete="off" novalidate aria-label="棋局设置">
      <label>宽度<input id="width" type="number" min="1" value="5" required></label>
      <label>高度<input id="height" type="number" min="1" value="5" required></label>
      <div class="form-actions"><button id="generate" class="primary" type="submit">生成棋局</button><button id="cancel" type="button" class="is-inactive" aria-hidden="true" disabled>取消</button></div>
      <div class="advanced" id="difficultySettings">
        <button id="difficultyToggle" type="button" aria-expanded="false" aria-controls="difficultyOptions"><svg class="icon" aria-hidden="true"><use href="#panelChevron"/></svg>难度设置</button>
        <div id="difficultyOptions" inert>
          <label title="整局各步骤经验证的最少线索数的平均值">平均最少线索下限<input id="minAverage" type="number" min="1" step="any"></label>
          <label title="最少需要三条或更多线索的步骤，占整条解法的比例">多线索步骤占比下限 (%)<input id="minMultiPercent" type="number" min="0" max="100" step="any"></label>
          <label title="至少有一步经验证需要这么多条线索">峰值线索数下限<input id="minPeakClues" type="number" min="1" step="1"></label>
        </div>
      </div>
    </form>
    <form id="editorSettings" class="settings editor-settings" autocomplete="off" aria-label="编辑器尺寸" hidden>
      <label>宽度<input id="editWidth" type="number" min="1" value="5" required></label>
      <label>高度<input id="editHeight" type="number" min="1" value="5" required></label>
      <div class="form-actions"><button type="submit">调整尺寸</button><button id="blankPosition" type="button">新建空白</button><button id="copyGamePosition" type="button">从游戏复制</button></div>
    </form>

    <div class="position-tools" role="group" aria-label="局面工具">
      <button type="button" id="importPosition"><svg class="icon" aria-hidden="true"><use href="#importIcon"/></svg>导入种子</button>
      <button type="button" id="exportPosition"><svg class="icon" aria-hidden="true"><use href="#exportIcon"/></svg>导出种子</button>
      <button type="button" id="playPosition" aria-describedby="draftMarkStatus" hidden><svg class="icon" aria-hidden="true"><use href="#play"/></svg>载入游戏</button>
    </div>
    <p id="draftMarkStatus" class="status" role="status" hidden></p>

    </div>
    <div class="layout">
      <section class="game" aria-label="扫雷棋盘">
        <div class="board-head">
          <div class="board-title"><span>棋盘</span><strong id="size">—</strong></div>
          <span class="counter" title="总雷数减去旗数"><svg class="icon" aria-hidden="true"><use href="#flag"/></svg><b id="remaining" aria-label="剩余雷数">—</b></span>
          <span id="gameTime" class="counter" title="用时（秒）"><svg class="icon" aria-hidden="true"><use href="#clock"/></svg><b id="time" aria-label="用时（秒）">0</b></span>
          <div id="markHistory" class="mark-history is-inactive" aria-hidden="true">
            <button type="button" id="undoMark" class="icon-button" title="撤销记号" aria-label="撤销记号"><svg class="icon" aria-hidden="true"><use href="#undoIcon"/></svg></button>
            <button type="button" id="redoMark" class="icon-button" title="重做记号" aria-label="重做记号"><svg class="icon" aria-hidden="true"><use href="#redoIcon"/></svg></button>
          </div>
          <button type="button" id="restart" class="icon-button" title="重开本局" aria-label="重开本局"><svg class="icon" aria-hidden="true"><use href="#restartIcon"/></svg></button>
          <div id="editTools" class="edit-tools" role="group" aria-label="编辑格子" hidden>
            <div class="mode-switch" role="group" aria-label="摆局方式">
              <button type="button" data-draft="mine" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#mine"/></svg>标雷</button>
              <button type="button" data-draft="numbers" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#formulaIcon"/></svg>标数字</button>
            </div>
            <div id="mineTools" class="edit-tools">
            <button type="button" data-edit="mine" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#mine"/></svg>雷位</button>
            <button type="button" data-edit="open" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#eye"/></svg>开格</button>
            <button type="button" data-edit="flag" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#flag"/></svg>旗标</button>
            </div>
            <div id="numberTools" class="number-tools" hidden>
              <label>总雷数<input id="draftMines" type="number" autocomplete="off" min="0" step="1" value="0"></label>
              <div id="digitPalette" class="digit-palette" role="group" aria-label="填入数字"></div>
            </div>
          </div>
        </div>
        <div class="board-scroll" hidden>
          <div id="board" class="board" aria-label="棋盘格子" hidden></div>
        </div>
        <footer class="board-footer" tabindex="-1" aria-label="本轮状态">
          <div id="searchCard" class="board-card search-card" hidden>
            <div class="search-summary">
              <p id="status" class="status" role="status" tabindex="0"></p>
              <button id="useCandidate" type="button" aria-describedby="status candidateShortfall" disabled>停止并采用候选</button>
            </div>
            <p id="candidateShortfall" class="status" role="status" hidden></p>
          </div>
          <div id="operationCard" class="board-card operation-card">
            <p id="operationText" class="status" role="status">等待生成或导入棋局</p>
            <div id="operationRound" class="operation-round" hidden>
              <div class="round-feedback">
                <p id="roundText" class="status" role="status"></p>
                <progress id="roundProgress" max="1" value="0" aria-label="本轮确认进度"></progress>
              </div>
              <button type="button" id="commitMarks" class="primary" hidden disabled>开格并插旗</button>
            </div>
          </div>
          <dl id="selectionReadout" class="board-card selection-readout" tabindex="0" aria-label="选区信息" hidden>
            <div><dt>选区</dt><dd id="selectionTerms"></dd></div>
            <div><dt>=</dt><dd id="selectionBounds" aria-live="polite" aria-label="可能的加权雷数"></dd></div>
          </dl>
        </footer>
      </section>

      <aside class="reason-slot" aria-label="推导与推理指标">
        <button id="openReasonPanel" type="button" class="icon-button" title="展开当前推理" aria-label="展开当前推理" aria-controls="reasonStatus" aria-expanded="false" inert><svg class="icon" aria-hidden="true"><use href="#panelChevron"/></svg></button>
        <div class="reason-fold"><div class="reason-content">
        <section id="reasonStatus" class="reason-status" aria-labelledby="reason-status-title">
          <div class="reason-status-head"><h2 id="reason-status-title">当前推理</h2><div class="reason-panel-tools"><button id="expandPosition" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#eye"/></svg>开扩</button><button type="button" class="icon-button" data-collapse-reason title="折叠当前推理" aria-label="折叠当前推理" aria-controls="reasonStatus" aria-expanded="true"><svg class="icon" aria-hidden="true"><use href="#panelChevron"/></svg></button></div></div>
          <p id="currentStatus" class="status" role="status">暂无棋局</p>
          <dl class="metrics current-metrics">
            <div><dt>必安全</dt><dd id="currentSafe">—</dd></div>
            <div><dt>必雷</dt><dd id="currentMines">—</dd></div>
            <div><dt id="currentClueLabel" title="红标作为已知条件，不计入线索数">本步最少线索</dt><dd id="currentClues">—</dd></div>
            <div><dt title="从当前盘面和已确认红标出发，各剩余推导步骤最少线索数的平均值">余局平均线索</dt><dd id="averageClues">—</dd></div>
            <div><dt title="从初始盘面无猜通关的回放中，各步最少线索数的最大值">本局峰值最少线索数</dt><dd id="peakClues">—</dd></div>
            <div><dt title="从初始盘面无猜通关的回放中，最少需要 3 条或更多线索的步骤占比">本局多线索推理占比</dt><dd id="multiClueRatio">—</dd></div>
          </dl>
          <p id="verificationStatus" class="muted" role="status"></p>
        </section>
        <section id="proofPane" class="proof-pane" aria-labelledby="proof-title" inert>
          <div class="panel-head"><h2 id="proof-title">推导</h2><div class="reason-panel-tools"><button type="button" class="icon-button" data-collapse-reason title="折叠推导与推理指标" aria-label="折叠推导与推理指标" aria-controls="reasonStatus proofPane" aria-expanded="true"><svg class="icon" aria-hidden="true"><use href="#panelChevron"/></svg></button><button type="button" id="closeProof" class="icon-button" title="关闭推导" aria-label="关闭推导"><svg class="icon" aria-hidden="true"><use href="#closeIcon"/></svg></button></div></div>
          <div id="proof" class="proof" aria-live="polite"></div>
        </section>
        </div></div>
      </aside>
    </div>
    <footer class="site-footer" aria-label="项目信息">
      <a href="LICENSE" target="_blank" rel="license noopener">MIT 开源协议</a>
      <a href="https://github.com/Keye3Tuido/EZMS" target="_blank" rel="noopener">GitHub 仓库</a>
    </footer>
  </main>
  <dialog id="seedDialog" aria-labelledby="seedDialogTitle">
    <div class="dialog-head"><h2 id="seedDialogTitle"></h2><button type="button" id="closeSeedDialog" class="icon-button" title="关闭" aria-label="关闭种子窗口"><svg class="icon" aria-hidden="true"><use href="#closeIcon"/></svg></button></div>
    <form id="seedForm">
      <label>局面种子<textarea id="positionSeedText" rows="4" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea></label>
      <p id="seedFeedback" class="status" role="status"></p>
      <div class="dialog-actions"><button type="button" id="copyPosition">复制种子</button><button type="submit" class="primary" id="confirmImport">导入</button></div>
    </form>
  </dialog>
  <nav id="toolDock" class="tool-dock" aria-label="棋盘工具">
    <button type="button" id="markMenu" class="orb launcher" title="蓝色记号（长按清空）" aria-label="蓝色记号" aria-expanded="false" aria-controls="markFlower"><svg class="icon" aria-hidden="true"><use href="#pen"/></svg></button>
    <button type="button" id="selectionMenu" class="orb launcher" title="选区（长按清空）" aria-label="选区" aria-expanded="false" aria-controls="selectionFlower"><svg class="icon" aria-hidden="true"><use href="#selectionIcon"/></svg></button>
    <button type="button" id="reasonMenu" class="orb launcher" title="推理工具" aria-label="推理工具" aria-expanded="false" aria-controls="reasonFlower"><svg class="icon" aria-hidden="true"><use href="#hintIcon"/></svg></button>
  </nav>
  <div id="reasonFlower" class="radial flower" role="group" aria-label="推理工具" inert>
    <svg class="radial-track" viewBox="-134 -138 268 240" aria-hidden="true"><defs><linearGradient id="reasonArc" gradientUnits="userSpaceOnUse" x1="-138" y1="0" x2="138" y2="0"><stop stop-color="#4d78ec"/><stop offset=".5" stop-color="#7758d2"/><stop offset="1" stop-color="#ce6260"/></linearGradient></defs><path id="reasonTrack" pathLength="1" stroke="url(#reasonArc)"/></svg>
    <button type="button" id="focus" class="orb petal" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#hintIcon"/></svg><span>显示线索</span></button>
    <button type="button" id="hint" class="orb petal" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#formulaIcon"/></svg><span>显示推导</span></button>
    <button type="button" id="answers" class="orb petal" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#eye"/></svg><span>答案</span></button>
    <button type="button" id="apply" class="orb petal"><svg class="icon" aria-hidden="true"><use href="#stepIcon"/></svg>求解一步</button>
    <button type="button" id="solve" class="orb petal"><svg class="icon" aria-hidden="true"><use href="#play"/></svg><span>自动求解</span></button>
  </div>
  <div id="selectionFlower" class="radial selection-flower" role="group" aria-label="选区工具" inert>
    <svg class="radial-track" viewBox="-134 -138 268 240" aria-hidden="true"><defs><linearGradient id="selectionArc" gradientUnits="userSpaceOnUse" x1="-65" x2="65"><stop stop-color="#8c57c9"/><stop offset="1" stop-color="#e3b238"/></linearGradient></defs><path id="selectionTrack" pathLength="1" stroke="url(#selectionArc)"/></svg>
    <button type="button" id="selectionAdd" class="orb petal" aria-label="增加选区" title="增加选区" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#selectionAddIcon"/></svg></button>
    <button type="button" id="selectionUndo" class="orb petal" aria-label="撤销选区" title="撤销选区" disabled><svg class="icon" aria-hidden="true"><use href="#undoIcon"/></svg></button>
    <button type="button" id="selectionRedo" class="orb petal" aria-label="重做选区" title="重做选区" disabled><svg class="icon" aria-hidden="true"><use href="#redoIcon"/></svg></button>
    <button type="button" id="selectionSubtract" class="orb petal" aria-label="减去选区" title="减去选区" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#selectionSubtractIcon"/></svg></button>
  </div>
  <div id="markFlower" class="radial marking" role="group" aria-label="蓝色记号工具" inert>
    <svg class="radial-track" viewBox="-134 -138 268 240" aria-hidden="true"><defs><linearGradient id="inkArc" gradientUnits="userSpaceOnUse" x1="0" y1="-93" x2="0" y2="55"><stop stop-color="#398dbe"/><stop offset="1" stop-color="#6754d0"/></linearGradient><linearGradient id="redInkArc" gradientUnits="userSpaceOnUse" x1="-65" x2="65"><stop stop-color="#d67089"/><stop offset="1" stop-color="#9b1e42"/></linearGradient></defs><path id="inkTrack" stroke="url(#inkArc)"/><path id="redInkTrack" d="M -54 -26 Q -32 0 0 0 T 54 -26" pathLength="1" stroke="url(#redInkArc)"/></svg>
  </div>
  </div>
</body>
</html>
